<!doctype html>

<title>بایگانی ریل استودیو</title>
<link rel="stylesheet" href="/style.css?v=11" />
<script>
  try {
    if (localStorage.getItem('reel.theme') === 'light') {
      document.documentElement.setAttribute('data-theme', 'light');
    }
    var ui = localStorage.getItem('reel.uiScale');
    if (ui === 'lg' || ui === 'xl') document.documentElement.setAttribute('data-ui', ui);
  } catch (e) {}
</script>
</head>
<body class="help-body">
<header class="site-header">
  <a class="brand-logo" href="/" dir="ltr" lang="en"><span class="brand-reel">Reel</span> Studio</a>

    <a href="/" data-nav="home">داشبورد</a>
    <span class="nav-sep" aria-hidden="true">|</span>
    <a href="/scenarios.html" data-nav="scenarios">سناریوها</a>
    <span class="nav-sep" aria-hidden="true">|</span>
    <a href="/archive.html" data-nav="archive">ضبط‌های قبل</a>
    <span class="nav-sep" aria-hidden="true">|</span>
    <button type="button" id="maker-open">سازنده</button>
    <span class="nav-sep" aria-hidden="true">|</span>
    <a href="/help.html" data-nav="help">راهنما</a>
    <span class="nav-sep" aria-hidden="true">|</span>
    <a href="/?settings=1" data-nav="settings" id="nav-settings">تنظیمات</a>
  </nav>
</header>
<div class="sub-page">
  <a href="/" class="back-btn">بازگشت</a>
  <h1>بایگانی</h1>
  <p class="page-lead">ضبط‌های قبول‌شده اینجاست. یکی رو برای زیرنویس باز کن، یا ویدیو رو پاک کن. خود سناریو می‌مونه. کارش تموم شد؟ «اتمام و آرشیو» رو بزن تا بره تب آرشیو.</p>
  <div class="settings-tabs list-tabs" role="tablist">
    <button type="button" class="on" data-list-tab="list" role="tab">لیست</button>
    <button type="button" data-list-tab="archive" role="tab">آرشیو</button>
  </div>
