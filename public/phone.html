<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>دوربین موبایل</title>
<link rel="stylesheet" href="/phone.css?v=2" />
</head>
<body>
  <video id="view" class="mirror" autoplay muted playsinline></video>

  <div id="tp-layer" class="tp-layer" hidden>
    <div class="tp-eye"></div>
    <div id="tp-stage" class="tp-stage">
      <div id="tp-text" class="tp-text"></div>
    </div>
  </div>

  <div id="tp-chrome" class="tp-chrome" hidden>
    <button id="tp-record" type="button">ضبط</button>
    <span id="tp-speed" class="tp-speed">۳</span>
  </div>

  <button id="tp-toggle" type="button" class="tp-toggle" hidden>متن</button>

  <div class="panel">
    <h1>دوربین موبایل</h1>
    <p id="status">بزن تا تصویر گوشی بره روی لپ‌تاپ.</p>
    <div class="row">
      <button id="go" type="button">شروع</button>
      <button id="flip" type="button" hidden>دوربین پشت</button>
    </div>
    <p class="note">صدا از میکروفون لپ‌تاپ ضبط می‌شه. این صفحه رو باز نگه دار و نذار صفحه‌ی گوشی خاموش بشه.</p>
  </div>
<script src="/phone.js?v=17"></script>
</body>
</html>
