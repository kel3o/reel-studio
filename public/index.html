<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ریل استودیو</title>
<link rel="stylesheet" href="/style.css" />
</head>
<body>
<div class="app">
  <aside class="scripts-panel">
    <div class="scripts-panel-head">
      <h1>سناریوها</h1>
      <a href="/help.html" class="help-link">راهنما</a>
    </div>
    <ul id="script-list" class="script-list"></ul>
  </aside>
  <main class="paragraphs-panel">
    <section class="device-setup">
      <div class="device-row">
        <label>دوربین
          <select id="camera-select"></select>
        </label>
        <label>میکروفون
          <select id="mic-select"></select>
        </label>
      </div>
      <video id="preview" class="preview" autoplay muted playsinline></video>
      <div class="meter-track">
        <div id="meter-bar" class="meter-bar"></div>
      </div>
      <p id="readiness" class="readiness">در حال گرفتن دسترسی دوربین و میکروفون</p>
    </section>
    <h2 id="script-title">یه سناریو رو انتخاب کن</h2>

    <section id="capture-panel" class="capture-panel" hidden>
      <header class="tp-header">
        <button id="tp-close" type="button" title="بستن حالت تمام‌صفحه">بستن</button>
        <span class="tp-sep"></span>
        <button id="tp-slower" type="button">کندتر</button>
        <span class="tp-readout" id="tp-speed">۳</span>
        <button id="tp-faster" type="button">تندتر</button>
        <button id="tp-smaller" type="button">کوچک‌تر</button>
        <span class="tp-readout" id="tp-size">۴۶</span>
        <button id="tp-bigger" type="button">بزرگ‌تر</button>
        <button id="tp-restart" type="button">از اول</button>
        <button id="tp-mirror" type="button">آینه</button>
        <button id="tp-open-folder" type="button" title="باز کردن پوشه‌ی این سناریو">پوشه</button>
        <span class="tp-spacer"></span>
        <span id="capture-status" class="tp-status">آماده</span>
        <span class="tp-clock" id="tp-clock">۰:۰۰</span>
      </header>

      <div class="tp-eyeline"></div>

      <div id="teleprompter" class="tp-stage">
        <div id="tp-text" class="tp-text"></div>
      </div>

      <div class="tp-bar" id="tp-bar"></div>

      <ol id="progress-strip" class="progress-strip"></ol>

      <div class="tp-cam-box">
        <video id="tp-live-cam" class="tp-cam-video" autoplay muted playsinline></video>
        <video id="review-video" class="tp-cam-video" hidden></video>
      </div>

      <div class="tp-record-row">
        <button id="tp-record" type="button" class="tp-record-btn">ضبط</button>
        <button id="tp-retake" type="button" class="tp-action-btn" hidden>دوباره‌ضبط</button>
        <button id="tp-accept" type="button" class="tp-action-btn tp-accept-btn" hidden>قبول</button>
      </div>

      <div id="tp-veil" class="tp-veil">
        <h1 id="tp-veil-title">تله‌پرامپتر</h1>
        <p>
          <kbd>فاصله</kbd> شروع و توقف ضبط
          <kbd>R</kbd> دوباره‌ضبط
          <kbd>Enter</kbd> قبول و بعدی
          <kbd>بالا</kbd><kbd>پایین</kbd> سرعت اسکرول
        </p>
        <p>کلمه‌های پررنگ تاکید می‌خوان، برچسب «مکث» یعنی یک نفس بایست.</p>
        <button id="tp-go" type="button">شروع</button>
      </div>
    </section>
  </main>
</div>
<script src="/devices.js"></script>
<script src="/capture.js"></script>
<script src="/app.js"></script>
</body>
</html>
