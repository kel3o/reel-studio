<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ریل استودیو</title>
<link rel="stylesheet" href="/style.css" />
</head>
<body>
<div class="app">
  <aside class="scripts-panel">
    <h1>سناریوها</h1>
    <ul id="script-list" class="script-list"></ul>
  </aside>
  <main class="paragraphs-panel">
    <section class="device-setup">
      <div class="device-row">
        <label>دوربین
          <select id="camera-select"></select>
        </label>
        <label>میکروفون
          <select id="mic-select"></select>
        </label>
      </div>
      <video id="preview" class="preview" autoplay muted playsinline></video>
      <div class="meter-track">
        <div id="meter-bar" class="meter-bar"></div>
      </div>
      <p id="readiness" class="readiness">در حال گرفتن دسترسی دوربین و میکروفون</p>
    </section>
    <h2 id="script-title">یه سناریو رو انتخاب کن</h2>

    <section id="capture-panel" class="capture-panel" hidden>
      <div class="teleprompter-controls">
        <label>سرعت اسکرول
          <input type="range" id="scroll-speed" min="0" max="100" value="30" />
        </label>
        <label>اندازه‌ی فونت
          <input type="range" id="font-size" min="18" max="60" value="32" />
        </label>
      </div>

      <div id="teleprompter" class="teleprompter"></div>

      <p id="capture-status" class="capture-status">آماده</p>
      <p class="capture-hint">
        فاصله برای شروع یا توقف ضبط، R برای دوباره‌ضبط، Enter برای قبول و رفتن سراغ پاراگراف بعدی
      </p>

      <video id="review-video" class="review-video" hidden></video>

      <ol id="progress-strip" class="progress-strip"></ol>
    </section>
  </main>
</div>
<script src="/devices.js"></script>
<script src="/capture.js"></script>
<script src="/app.js"></script>
</body>
</html>
