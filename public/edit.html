<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ویرایشگر</title>
<link rel="stylesheet" href="/style.css?v=34" />
<script>
  try {
    if (localStorage.getItem('reel.theme') === 'light') {
      document.documentElement.setAttribute('data-theme', 'light');
    }
    var ui = localStorage.getItem('reel.uiScale');
    if (ui === 'lg' || ui === 'xl') document.documentElement.setAttribute('data-ui', ui);
  } catch (e) {}
</script>
</head>
<body class="help-body">
<header class="site-header">
  <a class="brand-logo" href="/" dir="ltr" lang="en"><span class="brand-reel">Reel</span> Studio</a>
  <nav class="site-nav" aria-label="منو">
    <a href="/" data-nav="home">داشبورد</a>
    <span class="nav-sep" aria-hidden="true">|</span>
    <a href="/scenarios.html" data-nav="scenarios">سناریوها</a>
    <span class="nav-sep" aria-hidden="true">|</span>
    <a href="/archive.html" data-nav="archive">ضبط‌های قبل</a>
    <span class="nav-sep" aria-hidden="true">|</span>
    <button type="button" id="maker-open">سازنده</button>
    <span class="nav-sep" aria-hidden="true">|</span>
    <a href="/help.html" data-nav="help">راهنما</a>
    <span class="nav-sep" aria-hidden="true">|</span>
    <a href="/?settings=1" data-nav="settings" id="nav-settings">تنظیمات</a>
  </nav>
</header>
<div class="sub-page">
  <a href="/archive.html" class="back-btn">بازگشت</a>
  <h1 id="edit-title">ویرایشگر</h1>
  <p id="edit-status" class="page-lead"></p>

  <div class="edit-grid">
    <section class="edit-stage-wrap">
      <div class="edit-stage">
        <div class="edit-frame" id="edit-frame">
          <video id="player" playsinline></video>
          <canvas id="mix-view" class="mix-view" hidden></canvas>
          <div id="band-overlays" class="band-overlays" hidden></div>
          <canvas id="shape-view" class="shape-view" hidden></canvas>
          <div id="shape-layer" class="shape-layer" hidden></div>
          <div id="cap-layer" class="cap-layer">
            <div id="caption" class="caption font-vazir"></div>
            <div class="cap-box" aria-hidden="true">
              <button type="button" class="cap-handle" data-handle="nw" aria-label="اندازه"></button>
              <button type="button" class="cap-handle" data-handle="n" aria-label="اندازه"></button>
              <button type="button" class="cap-handle" data-handle="ne" aria-label="اندازه"></button>
              <button type="button" class="cap-handle" data-handle="e" aria-label="اندازه"></button>
              <button type="button" class="cap-handle" data-handle="se" aria-label="اندازه"></button>
              <button type="button" class="cap-handle" data-handle="s" aria-label="اندازه"></button>
              <button type="button" class="cap-handle" data-handle="sw" aria-label="اندازه"></button>
              <button type="button" class="cap-handle" data-handle="w" aria-label="اندازه"></button>
            </div>
          </div>
        </div>
      </div>
      <div class="edit-transport">
        <div class="edit-history" aria-label="برگشت و جلو">
          <button id="undo-btn" type="button" class="btn btn-icon" title="برگشت (Ctrl+Z)" aria-label="برگشت" disabled>↶</button>
          <button id="redo-btn" type="button" class="btn btn-icon" title="جلو (Ctrl+Shift+Z)" aria-label="جلو" disabled>↷</button>
        </div>
        <button id="play-btn" type="button" class="btn btn-accent">پخش</button>
        <span id="time-readout" class="time-readout">۰:۰۰ / ۰:۰۰</span>
        <label class="zoom-label">زوم پیش‌نمایش
          <input id="preview-zoom" type="range" min="100" max="300" step="10" value="100" />
          <span id="preview-zoom-out" class="opt-readout">۱۰۰</span>
        </label>
        <div class="shape-quick">
          <button type="button" class="btn shape-quick-btn" aria-haspopup="true">اشکال</button>
          <div class="shape-quick-menu" role="menu">
            <button type="button" data-quick-shape="circle">دایره</button>
            <button type="button" data-quick-shape="rect">مستطیل</button>
            <button type="button" data-quick-shape="arrow">فلش</button>
          </div>
        </div>
        <label class="video-guides">
          <input id="video-guides" type="checkbox" />
          خطوط ادیت ویدیو
        </label>
      </div>
    </section>

    <section class="edit-options">
      <h2>تنظیم زیرنویس</h2>
      <label>رنگ نوشته
        <input id="cap-color" type="color" value="#ffffff" />
      </label>
      <label>پوشش نوشته
        <input id="cap-text-opacity" type="range" min="0" max="100" step="1" value="100" />
        <span id="cap-text-opacity-out" class="opt-readout">۱۰۰</span>
      </label>
      <label>اندازه
        <input id="cap-size" type="range" min="8" max="120" step="1" value="48" />
        <span id="cap-size-out" class="opt-readout">۴۸</span>
      </label>
      <label>فاصله کلمات
        <input id="cap-word-space" type="range" min="0" max="40" step="1" value="0" />
        <span id="cap-word-space-out" class="opt-readout">۰</span>
      </label>
      <label>فاصله حروف
        <input id="cap-letter-space" type="range" min="0" max="20" step="1" value="0" />
        <span id="cap-letter-space-out" class="opt-readout">۰</span>
      </label>
      <label>فاصله سطرها
        <input id="cap-line-height" type="range" min="100" max="220" step="5" value="130" />
        <span id="cap-line-height-out" class="opt-readout">۱۳۰</span>
      </label>
      <label>فونت
        <select id="cap-font">
          <option value="vazir">وزیر متن</option>
          <option value="yekan">ایران یکان</option>
          <option value="titr">تیتر</option>
          <option value="lalezar">لاله زار</option>
          <option value="nastaliq">نستعلیق</option>
          <option value="ordibehesht">اردیبهشت</option>
          <option value="dastnevis">دستنویس</option>
          <option value="iransans">ایران سنس</option>
          <option value="peyda">پیدا</option>
          <option value="ravi">راوی</option>
        </select>
      </label>
      <div class="highlight-block">
        <div class="highlight-row">
          <label class="check-row">
            <input id="cap-highlight" type="checkbox" checked />
            هایلایت
          </label>
          <div id="highlight-fields" class="highlight-fields">
            <label class="hl-color">رنگ هایلایت
              <input id="cap-highlight-color" type="color" value="#f5c542" />
            </label>
          </div>
        </div>
        <label id="highlight-opacity-wrap">پوشش هایلایت
          <input id="cap-opacity" type="range" min="0" max="100" step="1" value="50" />
          <span id="cap-opacity-out" class="opt-readout">۵۰</span>
        </label>
      </div>
      <div class="highlight-block">
        <div class="highlight-row">
          <label class="check-row">
            <input id="cap-background" type="checkbox" />
            پس زمینه زیرنویس
          </label>
          <div id="background-fields" class="highlight-fields" hidden>
            <label class="hl-color">رنگ پس‌زمینه
              <input id="cap-background-color" type="color" value="#000000" />
            </label>
          </div>
        </div>
        <label id="background-opacity-wrap" hidden>پوشش پس‌زمینه
          <input id="cap-background-opacity" type="range" min="0" max="100" step="1" value="60" />
          <span id="cap-background-opacity-out" class="opt-readout">۶۰</span>
        </label>
      </div>
      <label class="check-row">
        <input id="cap-word" type="checkbox" />
        کلمه‌به‌کلمه
      </label>
      <div class="edit-actions">
        <button id="rebuild-btn" type="button" class="btn">زمان‌بندی دوباره</button>
        <button id="save-btn" type="button" class="btn">ثبت تغییرات</button>
        <button id="render-btn" type="button" class="btn btn-accent">ثبت نهایی</button>
        <a id="render-link" class="btn" hidden>دیدن فایل</a>
        <button id="open-export" type="button" class="btn" hidden>نمایش پوشه</button>
      </div>
      <video id="export-player" class="export-player" controls playsinline hidden></video>
    </section>
  </div>

  <section class="tl-panel">
    <input id="tl-attach-file" type="file" accept="video/mp4,video/webm,video/quicktime,audio/mpeg,audio/wav,audio/mp4,audio/aac,audio/ogg,.mp4,.webm,.mov,.mp3,.wav,.m4a,.aac,.ogg" hidden />
    <div id="tl-editbar" class="tl-editbar">
      <div class="tl-edit-main">
      <p id="tl-edit-label" class="opt-hint">روی خط ویدیو یا یه کلمه بزن.</p>
      <div id="tl-clip-tools" class="tl-toolset" hidden>
        <button id="tl-split" type="button" class="btn">برش</button>
        <button id="tl-delete-clip" type="button" class="btn btn-danger">حذف</button>
        <label class="tl-inline">صدا
          <input id="tl-volume" type="range" min="0" max="200" step="1" value="100" />
          <span id="tl-volume-out" class="opt-readout">۱۰۰</span>
        </label>
        <button id="tl-mute" type="button" class="btn btn-icon" title="بی‌صدا" aria-label="بی‌صدا">
          <svg class="mute-icon mute-icon-on" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M4 9v6h4l5 4V5L8 9H4zm11.5 3a3.5 3.5 0 0 0-1.9-3.1v6.2A3.5 3.5 0 0 0 15.5 12zM14 4.1v2.1a6 6 0 0 1 0 11.6v2.1a8 8 0 0 0 0-15.8z"/></svg>
          <svg class="mute-icon mute-icon-off" viewBox="0 0 24 24" aria-hidden="true" hidden><path fill="currentColor" d="M16.5 12a3.5 3.5 0 0 0-1.9-3.1v2.2l1.8 1.8c.07-.3.1-.6.1-.9zm2.5.1c0 .9-.2 1.7-.5 2.5l1.5 1.5A7.9 7.9 0 0 0 21 12.1c0-3.3-1.8-6.1-4.5-7.5v2.1A5.9 5.9 0 0 1 19 12.1zM4.3 3 3 4.3 7.7 9H4v6h4l5 4v-6.7l4.7 4.7.8-.5-13.2-13.5zM14 5l-1.9 1.5L14 8.4V5z"/></svg>
        </button>
        <label class="tl-inline">سرعت
          <input id="tl-speed" type="range" min="50" max="200" step="1" value="100" />
          <span id="tl-speed-out" class="opt-readout">۱</span>
        </label>
        <label class="tl-inline">سرعت ویژه
          <select id="tl-speed-special">
            <option value="">عادی</option>
            <option value="3">۳×</option>
            <option value="4">۴×</option>
            <option value="5">۵×</option>
            <option value="10">۱۰×</option>
          </select>
        </label>
      </div>
      <div id="tl-word-tools" class="tl-toolset" hidden>
        <button id="tl-edit-word" type="button" class="btn btn-edit">ویرایش</button>
        <button id="tl-add-word" type="button" class="btn btn-add">افزودن کلمه</button>
        <button id="tl-add-pause" type="button" class="btn">مکث بین زیرنویس</button>
        <button id="tl-add-blank" type="button" class="btn">متن بدون زیرنویس</button>
        <button id="tl-break-caption" type="button" class="btn">زیرنویس بعدی</button>
        <button id="tl-delete-word" type="button" class="btn btn-danger">حذف</button>
      </div>
      <div id="tl-shape-tools" class="tl-toolset" hidden>
        <label class="tl-inline">رنگ
          <input id="shape-color" type="color" value="#ff3d1f" />
        </label>
        <label id="shape-diameter-wrap" class="tl-inline">قطر
          <input id="shape-diameter" type="range" min="6" max="80" step="1" value="22" />
          <span id="shape-diameter-out" class="opt-readout">۲۲</span>
        </label>
        <label id="shape-width-wrap" class="tl-inline">عرض
          <input id="shape-width" type="range" min="6" max="90" step="1" value="28" />
          <span id="shape-width-out" class="opt-readout">۲۸</span>
        </label>
        <label id="shape-height-wrap" class="tl-inline">ارتفاع
          <input id="shape-height" type="range" min="4" max="90" step="1" value="16" />
          <span id="shape-height-out" class="opt-readout">۱۶</span>
        </label>
        <label class="tl-inline">ضخامت
          <input id="shape-stroke" type="range" min="2" max="36" step="1" value="8" />
          <span id="shape-stroke-out" class="opt-readout">۸</span>
        </label>
      </div>
      </div>
      <div class="tl-edit-fixed">
        <label class="zoom-label">درشت‌نمایی
          <input id="tl-zoom" type="range" min="1" max="8" step="0.1" value="1" />
        </label>
        <button id="tl-delete-line" type="button" class="btn btn-danger">حذف خط</button>
        <div class="tl-add-wrap">
          <button id="tl-add-line" type="button" class="btn">خط جدید</button>
          <div id="tl-add-menu" class="tl-add-menu" hidden>
            <button type="button" data-lane-kind="video">تصویر / ویدیو</button>
            <button type="button" data-lane-kind="audio">صدا</button>
            <button type="button" data-lane-kind="text">متن</button>
            <div class="tl-shape-item">
              <button type="button" data-shape-menu="1">اشکال</button>
              <div id="tl-shape-picks" class="tl-shape-picks">
                <button type="button" data-lane-kind="shape-circle">دایره</button>
                <button type="button" data-lane-kind="shape-rect">مستطیل</button>
                <button type="button" data-lane-kind="shape-arrow">فلش</button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="tl-wrap">
      <div class="tl-labels" id="tl-labels">
        <span>کلمه‌ها</span>
        <span>ویدیو</span>
      </div>
      <div class="tl-scroll" id="tl-scroll">
        <div class="tl-inner" id="tl-inner" dir="ltr">
          <div class="tl-lane" id="word-lane"></div>
          <div class="tl-lanes" id="video-lanes">
            <div class="tl-lane tl-video" id="video-lane" data-lane="0"></div>
          </div>
          <div class="tl-playhead" id="playhead"></div>
        </div>
      </div>
    </div>
  </section>
</div>
<div id="split-ask" class="picker-layer" hidden>
  <div class="picker-card split-ask-card" role="dialog" aria-modal="true" aria-labelledby="split-ask-title">
    <h2 id="split-ask-title">لاین صدا جدا بشه؟</h2>
    <p class="opt-hint">«آره» یعنی تصویر بی‌صدا روی یه خط و صداش روی یه خط صدای جدا. «نه» یعنی صدا و تصویر با هم روی همون یه خط می‌مونن.</p>
    <div class="split-ask-btns">
      <button type="button" class="btn btn-accent" data-split-answer="yes">آره، جدا کن</button>
      <button type="button" class="btn" data-split-answer="no">نه، با هم بمونه</button>
      <button type="button" class="btn" data-split-answer="cancel">بی‌خیال</button>
    </div>
  </div>
</div>
<script src="/shell.js"></script>
<script src="/rec-shortcut.js?v=2"></script>
<script src="/edit.js?v=25"></script>
</body>
</html>
